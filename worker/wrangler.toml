# 행선지2: World — 정답·거리·순위 서버 (Cloudflare Workers 무료 플랜 + D1)
#
# 정답은 이 서버만 안다. 브라우저는 고른 나라를 보내고 거리와 순위만 돌려받는다.
# 오늘 정답은 비밀값 ANSWER_SALT 로 섞은 순서에서 꺼내므로, 코드를 봐도 미리 알 수 없다.
#   npx wrangler secret put ANSWER_SALT     (한 번만. 바꾸면 그날부터 정답 순서가 통째로 바뀐다)
# 행선지(eodigun)와 코드 틀은 같지만 Worker·D1 은 따로다.
# 저장소 이름은 wheretogo-world 로 바뀌었지만 Worker·D1 은 주소가 끊기지 않게 haengseonji-world 그대로 둔다.
name = "haengseonji-world"
main = "src/index.js"
compatibility_date = "2026-08-01"
workers_dev = true
preview_urls = false

[vars]
ALLOW_ORIGINS = "https://41ways.github.io"

[[d1_databases]]
binding = "DB"
database_name = "haengseonji-world"
database_id = "1b6c7669-114a-4da5-9dc8-079572409c0e"
